[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-blender"
version = "0.2.0"
description = "Autonomous Prompt-Driven 3D CAD, 3D Printing, and CNC Manufacturing Engine for Blender"
readme = "README.md"
authors = [{ name = "Jimmy De Jesus", email = "jimmyjdejesus@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
agentic-blender = "agentic_blender.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
